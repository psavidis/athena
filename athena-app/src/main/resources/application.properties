server.port=7332

# Public base URL of this backend, used to build the GitHub App manifest's
# callback URL. GitHub's manifest flow accepts http://localhost as a valid
# redirect target, so Athena's App can be created without any public hosting.
athena.github.app.backend-base-url=http://localhost:7332

# Where the browser is sent back to after GitHub App manifest/installation
# callbacks complete. The Vite dev server (frontend/vite.config.ts).
athena.github.app.frontend-base-url=http://localhost:7331
